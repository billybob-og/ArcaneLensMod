modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional

description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# This addon is meaningless without the base mod - see the plan's design (same-repo subproject
# specifically so this dependency can be developed against directly, not published/versioned).
[[dependencies.${mod_id}]]
    modId="arcanelens"
    mandatory=true
    versionRange="[5.1.1,)"
    ordering="AFTER"
    side="BOTH"
